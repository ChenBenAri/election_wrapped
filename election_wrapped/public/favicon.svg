<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="My Political ID">
  <defs>
    <clipPath id="flag-circle">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="31" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25" />

  <g clip-path="url(#flag-circle)">
    <rect width="64" height="64" fill="#ffffff" />

    <!-- Cropped flag bands: only partial stripes visible at the edges -->
    <rect width="64" height="11" fill="#0038b8" />
    <rect y="53" width="64" height="11" fill="#0038b8" />

    <!-- Zoomed-in Star of David for clarity at small sizes -->
    <path fill="#0038b8" d="M32 15 47.5 41.8 16.5 41.8Z" />
    <path fill="#0038b8" d="M32 49 47.5 22.2 16.5 22.2Z" />
  </g>
</svg>
